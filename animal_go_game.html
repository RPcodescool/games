
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#app{min-height:600px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}
.topbar{background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}
.badge-green{background:#EAF3DE;color:#3B6D11}
.badge-amber{background:#FAEEDA;color:#854F0B}
.badge-red{background:#FCEBEB;color:#A32D2D}
.badge-blue{background:#E6F1FB;color:#185FA5}
.badge-teal{background:#E1F5EE;color:#0F6E56}
.badge-purple{background:#EEEDFE;color:#534AB7}
.nav{display:flex;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.nav button{flex:1;padding:10px 4px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--color-text-secondary);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.15s}
.nav button.active{color:#1D9E75;font-weight:500}
.nav-icon{font-size:18px}
.scroll{flex:1;overflow-y:auto;padding:12px}
button.btn-primary{padding:8px 18px;background:#1D9E75;color:#fff;border:none;border-radius:var(--border-radius-md);cursor:pointer;font-size:14px;font-weight:500}
button.btn-secondary{padding:8px 18px;background:var(--color-background-secondary);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;font-size:14px}
button.btn-danger{padding:8px 18px;background:#E24B4A;color:#fff;border:none;border-radius:var(--border-radius-md);cursor:pointer;font-size:14px;font-weight:500}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px}
.hp-bar{height:8px;border-radius:4px;background:var(--color-background-secondary);overflow:hidden;margin:4px 0}
.hp-fill{height:100%;border-radius:4px;transition:width 0.4s}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;margin:2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-card{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;text-align:center;cursor:pointer;transition:border-color 0.15s}
.mini-card:hover{border-color:var(--color-border-secondary)}
.mini-card.owned{border-color:#1D9E75}
.mini-card.not-owned{opacity:0.4;filter:grayscale(1)}
.world-map{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px}
.region-btn{padding:14px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);cursor:pointer;text-align:left;transition:all 0.15s}
.region-btn:hover{border-color:#1D9E75;background:#E1F5EE}
.region-emoji{font-size:22px;display:block;margin-bottom:4px}
.region-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.region-sub{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.battle-field{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:12px 0}
.fighter{flex:1;text-align:center}
.fighter-emoji{font-size:52px;display:block;margin:6px 0}
.battle-moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.move-btn{padding:10px 6px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);cursor:pointer;font-size:12px;font-weight:500;text-align:center;transition:all 0.15s;color:var(--color-text-primary)}
.move-btn:hover:not(:disabled){background:#E1F5EE;border-color:#1D9E75}
.move-btn:disabled{opacity:0.4;cursor:not-allowed}
.log-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;font-size:13px;color:var(--color-text-secondary);min-height:52px;margin:8px 0;line-height:1.5}
.xp-bar{height:6px;border-radius:3px;background:var(--color-background-secondary);overflow:hidden;margin:4px 0}
.xp-fill{height:100%;border-radius:3px;background:#185FA5;transition:width 0.5s}
.caught-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);cursor:pointer;border:0.5px solid var(--color-border-tertiary)}
.caught-item:hover{border-color:#1D9E75}
.type-pill{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1D9E75;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.rarity-common{color:#5F5E5A}
.rarity-rare{color:#185FA5}
.rarity-epic{color:#534AB7}
.rarity-legendary{color:#854F0B}
</style>

// ─── FIXED DAMAGE FORMULA ───────────────────────────────────────────────────
// Old formula: (atk - def*0.3) * rand  →  e.g. 85 - 60*0.3 = 85-18 = 67, but
// enemy: 95 - 60*0.3 = 77.  Both should be similar. Root cause was enemy DEF
// was being subtracted from player ATK by accident due to wrong variable refs.
// New formula: damage = (attacker.atk * 0.6) - (defender.def * 0.15) + rand(10,25)
// This guarantees minimum meaningful damage (~25-40) even against high-DEF targets,
// and scales nicely so high-ATK animals hit noticeably harder (~55-75).
function calcDamage(atkStat, defStat) {
  const base = Math.round(atkStat * 0.6 - defStat * 0.15);
  const variance = Math.floor(Math.random() * 16) + 10; // +10 to +25
  return Math.max(15, base + variance);
}

function startEncounter(regionId){
  if(state.balls<=0){showToast("No capture balls left! Buy more in the shop.");return;}
  const regionAnimals=ANIMALS.filter(a=>a.region===regionId);
  const weights={common:50,rare:30,epic:15,legendary:5};
  const pool=[];
  regionAnimals.forEach(a=>{for(let i=0;i<weights[a.rarity];i++)pool.push(a);});
  const animal=pool[Math.floor(Math.random()*pool.length)];
  currentEncounter={animal,caught:false};
  wildHp=animal.hp;
  renderEncounter(animal);
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-encounter").classList.add("active");
  prevScreen=currentScreen;currentScreen="encounter";
}

function renderEncounter(animal){
  const tc=TYPE_COLORS[animal.type]||{bg:"#F1EFE8",color:"#444441"};
  const already=!!state.caught[animal.id];
  const hpPct=Math.round(wildHp/animal.hp*100);

      <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">ATK ${animal.atk} · DEF ${animal.def} · SPD ${animal.spd}</div>

  `;

function throwBall(type){
  const animal=currentEncounter.animal;
  const base={common:65,rare:40,epic:20,legendary:8};
  // Lower HP = better catch chance
  const hpBonus=Math.round((1-wildHp/animal.hp)*30);
  let chance=base[animal.rarity]+hpBonus+(type==="super"?20:0);
  if(type==="super"){if(state.items.superBall<=0){showToast("No Super Balls!");return;}state.items.superBall--;}
  else{if(state.balls<=0){showToast("No balls left!");return;}state.balls--;}
  const log=document.getElementById("enc-log");
  const roll=Math.random()*100;
  if(roll<chance){
    log.innerHTML=`✅ Gotcha! <strong>${animal.name}</strong> was caught! +50 XP +30 Coins`;
    catchAnimal(animal);
    disableEncounterBtns();
    setTimeout(()=>showTab(prevScreen==="region"?"region":"explore"),1800);
  } else {
    // Wild animal counter-scratches
    const scratch=Math.floor(Math.random()*8)+3;
    wildHp=Math.max(5,wildHp-scratch);
    const hpPct=Math.round(wildHp/animal.hp*100);
    const fill=document.getElementById("enc-hp-fill");
    if(fill){fill.style.width=hpPct+"%";fill.style.background=hpPct>50?"#1D9E75":hpPct>25?"#EF9F27":"#E24B4A";}
    log.innerHTML=`❌ <strong>${animal.name}</strong> broke free! ${wildHp/animal.hp<0.3?"It's weakened — better catch chance!":""}`;
    if(Math.random()<0.12){
      log.innerHTML+=`<br>💨 <strong>${animal.name}</strong> fled!`;
      disableEncounterBtns();
      setTimeout(()=>showTab(prevScreen==="region"?"region":"explore"),1500);
    }
  }
  document.getElementById("ball-count").textContent="Balls: "+state.balls;
  save();
}

function disableEncounterBtns(){
  document.querySelectorAll("#enc-content button").forEach(b=>b.disabled=true);
}
function fleeEncounter(){showToast("Got away safely!");showTab(prevScreen==="region"?"region":"explore");}

function catchAnimal(animal){
  state.catches++;
  const isNew=!state.caught[animal.id];
  state.caught[animal.id]={level:state.caught[animal.id]?state.caught[animal.id].level:1,xp:0,hp:animal.hp,maxHp:animal.hp};
  addXP(50);state.coins+=30;
  showToast(isNew?"New species: "+animal.name+"!":animal.name+" caught!");
  updateDexCount();save();
}

function addXP(amt){
  state.xp=Math.max(0,state.xp+amt);
  const needed=state.level*100;
  if(state.xp>=needed){state.xp-=needed;state.level++;showToast("Level up! Now level "+state.level);}
}

function updateDexCount(){
  const n=Object.keys(state.caught).length;
  const el=document.getElementById("dex-count");
  if(el)el.textContent=n+" / "+ANIMALS.length;
}

function battleFirst(){
  if(state.team.length===0){showToast("Add animals to your team first!");return;}
  const myId=state.team.find(id=>state.caught[id]&&state.caught[id].hp>0);
  if(!myId){showToast("All team members are fainted! Heal them first.");return;}
  const myAnimal=ANIMALS.find(a=>a.id===myId);
  const myData=state.caught[myId];
  startBattle(myAnimal,myData,currentEncounter.animal,null,"catch");
}

// ─── BATTLE ─────────────────────────────────────────────────────────────────
function startBattle(myAnimal,myData,oppAnimal,oppData,mode){
  currentBattle={
    myAnimal, myData, oppAnimal,
    oppHp: oppAnimal.hp,
    myHp: myData ? myData.hp : myAnimal.hp,
    mode, round:1, over:false
  };
  renderBattle();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-battle").classList.add("active");
  prevScreen=currentScreen;currentScreen="battle";
}

function renderBattle(){
  const b=currentBattle;
  document.getElementById("battle-round-badge").textContent="Round "+b.round;
  const myPct=Math.max(0,Math.round(b.myHp/b.myAnimal.hp*100));
  const oppPct=Math.max(0,Math.round(b.oppHp/b.oppAnimal.hp*100));
  const hpColor=p=>p>50?"#1D9E75":p>25?"#EF9F27":"#E24B4A";
  document.getElementById("battle-content").innerHTML=`
    <div class="battle-field">
      <div class="fighter">
        <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px">WILD</div>
        <span class="fighter-emoji">${b.oppAnimal.emoji}</span>
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary)">${b.oppAnimal.name}</div>
        <div class="hp-bar"><div class="hp-fill" style="width:${oppPct}%;background:${hpColor(oppPct)}"></div></div>
        <div style="font-size:11px;color:var(--color-text-secondary)">${Math.max(0,Math.round(b.oppHp))} / ${b.oppAnimal.hp}</div>
      </div>
      <div style="font-size:22px;align-self:center;color:var(--color-text-secondary)">⚔️</div>
      <div class="fighter">
        <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px">YOURS</div>
        <span class="fighter-emoji">${b.myAnimal.emoji}</span>
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary)">${b.myAnimal.name}</div>
        <div class="hp-bar"><div class="hp-fill" style="width:${myPct}%;background:${hpColor(myPct)}"></div></div>
        <div style="font-size:11px;color:var(--color-text-secondary)">${Math.max(0,Math.round(b.myHp))} / ${b.myAnimal.hp}</div>
      </div>
    </div>
    <div class="log-box" id="battle-log">Choose a move!</div>
    ${b.over ? renderBattleResult() : `
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;color:var(--color-text-primary)">Moves</div>
      <div class="battle-moves">
        ${b.myAnimal.moves.map((m,i)=>`<button class="move-btn" onclick="useMove(${i})">${m}</button>`).join("")}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-secondary" style="flex:1" onclick="useHealPotion()" ${state.items.healPotion<=0?"disabled":""}>💊 Heal (${state.items.healPotion})</button>
        <button class="btn-danger" style="flex:1" onclick="fleeBattle()">🏃 Flee</button>
      </div>
    `}
  `;
}

function renderBattleResult(){
  const b=currentBattle;
  const won=b.myHp>0;
  return`<div style="background:${won?"#E1F5EE":"#FCEBEB"};border:0.5px solid ${won?"#1D9E75":"#E24B4A"};border-radius:var(--border-radius-lg);padding:16px;text-align:center;margin-top:12px">
    <div style="font-size:28px;margin-bottom:6px">${won?"🏆":"💀"}</div>
    <div style="font-size:16px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px">${won?"Victory!":"Defeated!"}</div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:12px">${won?"+40 XP, +25 Coins":"Better luck next time!"}</div>
    ${b.mode==="catch"&&won?`<button class="btn-primary" style="margin-bottom:8px;width:100%" onclick="returnToEncounter()">⚪ Now try to catch it!</button>`:""}
    <button class="btn-secondary" style="width:100%" onclick="showTab('explore')">🌍 Back to Explore</button>
  </div>`;
}

function useMove(i){
  const b=currentBattle;
  if(b.over)return;
  const move=b.myAnimal.moves[i];

  // Player attacks — uses fixed formula
  const dmgToOpp=calcDamage(b.myAnimal.atk, b.oppAnimal.def);
  b.oppHp-=dmgToOpp;
  let log=`${b.myAnimal.emoji} used <strong>${move}</strong>! Dealt <strong>${dmgToOpp}</strong> damage.`;

  if(b.oppHp<=0){
    b.over=true;state.battles++;state.wins++;addXP(40);state.coins+=25;
    log+=`<br>💥 ${b.oppAnimal.name} fainted! You win!`;
    if(b.myData)state.caught[b.myAnimal.id].hp=Math.max(1,Math.round(b.myHp));
    // sync wildHp for catch screen
    wildHp=1;
    save();renderBattle();
    document.getElementById("battle-log").innerHTML=log;return;
  }

  // Enemy attacks — uses fixed formula
  const oppMove=b.oppAnimal.moves[Math.floor(Math.random()*b.oppAnimal.moves.length)];
  const dmgToMe=calcDamage(b.oppAnimal.atk, b.myAnimal.def);
  b.myHp-=dmgToMe;
  log+=`<br>${b.oppAnimal.emoji} used <strong>${oppMove}</strong>! Took <strong>${dmgToMe}</strong> damage.`;

  if(b.myHp<=0){
    b.over=true;state.battles++;
    log+=`<br>💀 ${b.myAnimal.name} fainted! You lost!`;
    if(b.myData)state.caught[b.myAnimal.id].hp=0;
  }
  b.round++;save();renderBattle();
  const logEl=document.getElementById("battle-log");
  if(logEl)logEl.innerHTML=log;
}

function useHealPotion(){
  const b=currentBattle;
  if(state.items.healPotion<=0)return;
  state.items.healPotion--;
  const heal=Math.round(b.myAnimal.hp*0.4);
  b.myHp=Math.min(b.myAnimal.hp,b.myHp+heal);
  showToast("Healed "+heal+" HP!");
  renderBattle();
  document.getElementById("battle-log").innerHTML=`💊 Used Heal Potion! Restored ${heal} HP.`;
}

function fleeBattle(){showToast("Fled the battle!");showTab("explore");}

function returnToEncounter(){
  // update wildHp to reflect the beaten-down enemy
  wildHp=Math.max(5, currentBattle.oppHp);
  renderEncounter(currentEncounter.animal);
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-encounter").classList.add("active");
  currentScreen="encounter";
}

    <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px">${owned.length} caught · ${ANIMALS.length-owned.length} remaining</div>
    <div class="grid-3">${filtered.map(a=>{
      const isOwned=!!state.caught[a.id];
      const tc=TYPE_COLORS[a.type]||{bg:"#F1EFE8",color:"#444441"};

      </div>`;

}

function showAnimalDetail(id){

  const data=state.caught[id];
  if(!animal||!data)return;
  const tc=TYPE_COLORS[animal.type]||{bg:"#F1EFE8",color:"#444441"};
  const hpPct=Math.round(data.hp/animal.hp*100);
  const hpColor=hpPct>50?"#1D9E75":hpPct>25?"#EF9F27":"#E24B4A";
  const inTeam=state.team.includes(id);
  document.getElementById("detail-content").innerHTML=`
    <div style="text-align:center;padding:10px 0 16px">
      <span style="font-size:70px;display:block">${animal.emoji}</span>
      <div style="font-size:20px;font-weight:500;color:var(--color-text-primary)">${animal.name}</div>
      <div style="display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap">
        <span class="type-pill" style="background:${tc.bg};color:${tc.color}">${animal.type}</span>
        <span class="type-pill" style="background:#E1F5EE;color:#0F6E56">${animal.region}</span>
        <span style="font-size:11px;color:${RARITY_COLOR[animal.rarity]};font-weight:500;padding:2px 7px">${RARITY_LABEL[animal.rarity]}</span>
      </div>
    </div>
    <div class="card" style="margin-bottom:10px">
      <div style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)">Stats — Level ${data.level}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <span>HP</span>
        <div style="flex:1;margin:0 10px"><div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%;background:${hpColor}"></div></div></div>
        <span>${Math.round(data.hp)} / ${animal.hp}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><span>Attack</span><span>${animal.atk}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><span>Defense</span><span>${animal.def}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><span>Speed</span><span>${animal.spd}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><span>Est. damage/hit</span><span style="color:#1D9E75;font-weight:500">${calcDamage(animal.atk,60)} – ${calcDamage(animal.atk,60)+10}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Habitat</span><span>${animal.habitat}</span></div>
    </div>
    <div class="card" style="margin-bottom:10px">
      <div style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)">Moves</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${animal.moves.map(m=>`<span style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);padding:4px 10px;border-radius:var(--border-radius-md);font-size:12px;color:var(--color-text-primary)">${m}</span>`).join("")}</div>
    </div>
    <div style="font-size:13px;color:var(--color-text-secondary);font-style:italic;margin-bottom:14px;line-height:1.6">${animal.desc}</div>
    <div class="grid-2" style="margin-bottom:10px">
      ${inTeam?`<button class="btn-danger" onclick="removeFromTeam(${id})">Remove from Team</button>`:`<button class="btn-primary" onclick="addToTeam(${id})" ${state.team.length>=6?"disabled":""}>+ Add to Team</button>`}
      ${data.hp<animal.hp?`<button class="btn-secondary" onclick="healAnimal(${id})" ${state.items.healPotion<=0?"disabled":""}>💊 Heal (${state.items.healPotion})</button>`:"<div></div>"}
    </div>
  `;
  prevScreen=currentScreen;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-animal-detail").classList.add("active");
  currentScreen="animal-detail";
}

function addToTeam(id){
  if(state.team.length>=6){showToast("Team is full!");return;}
  if(!state.team.includes(id)){state.team.push(id);showToast("Added to team!");save();showAnimalDetail(id);}
}
function removeFromTeam(id){state.team=state.team.filter(t=>t!==id);showToast("Removed from team.");save();showAnimalDetail(id);}
function healAnimal(id){
  if(state.items.healPotion<=0){showToast("No heal potions!");return;}
  state.items.healPotion--;
  const animal=ANIMALS.find(a=>a.id===id);
  state.caught[id].hp=animal.hp;
  showToast(animal.name+" fully healed!");save();showAnimalDetail(id);
}

// ─── TEAM ───────────────────────────────────────────────────────────────────
function renderTeam(){
  const list=document.getElementById("team-list");
  document.getElementById("team-count").textContent=state.team.length+" / 6";
  if(state.team.length===0){
    list.innerHTML=`<div style="padding:30px;text-align:center;color:var(--color-text-secondary)"><div style="font-size:40px;margin-bottom:10px">🐾</div><div>No animals in your team yet.</div></div>`;return;
  }
  list.innerHTML=`<div style="padding:12px;display:flex;flex-direction:column;gap:10px">${state.team.map(id=>{
    const animal=ANIMALS.find(a=>a.id===id);
    const data=state.caught[id];
    if(!animal||!data)return"";
    const hpPct=Math.round(data.hp/animal.hp*100);
    const hpColor=hpPct>50?"#1D9E75":hpPct>25?"#EF9F27":"#E24B4A";
    const tc=TYPE_COLORS[animal.type]||{bg:"#F1EFE8",color:"#444441"};
    return`<div class="caught-item" onclick="showAnimalDetail(${id})">
      <div style="font-size:36px">${animal.emoji}</div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:14px;font-weight:500;color:var(--color-text-primary)">${animal.name}</span>
          <span style="font-size:11px;background:${tc.bg};color:${tc.color};padding:2px 7px;border-radius:10px">${animal.type}</span>
        </div>
        <div class="hp-bar" style="margin:4px 0"><div class="hp-fill" style="width:${hpPct}%;background:${hpColor}"></div></div>
        <div style="font-size:11px;color:var(--color-text-secondary)">${Math.round(data.hp)}/${animal.hp} HP · Lv.${data.level} · DMG ~${calcDamage(animal.atk,60)}-${calcDamage(animal.atk,60)+12}</div>
      </div>
    </div>`;
  }).join("")}
  <button class="btn-secondary" style="width:100%;margin-top:6px" onclick="startWildBattle()">⚔️ Challenge Wild Battle</button>
  </div>`;
}

function startWildBattle(){
  if(state.team.length===0){showToast("No team members!");return;}
  const myId=state.team.find(id=>state.caught[id]&&state.caught[id].hp>0);
  if(!myId){showToast("All team members fainted! Heal them first.");return;}
  const myAnimal=ANIMALS.find(a=>a.id===myId);
  const myData=state.caught[myId];
  const opponents=ANIMALS.filter(a=>a.id!==myId);
  const opp=opponents[Math.floor(Math.random()*opponents.length)];
  startBattle(myAnimal,myData,opp,null,"wild");
}

// ─── SHOP ───────────────────────────────────────────────────────────────────
function renderShop(){
  document.getElementById("shop-coins").textContent="Coins: "+state.coins;
  document.getElementById("shop-content").innerHTML=`
    <div style="padding:12px">
      <div style="background:#E1F5EE;border:0.5px solid #9FE1CB;border-radius:var(--border-radius-lg);padding:12px;margin-bottom:14px">
        <div style="font-size:13px;color:#0F6E56;font-weight:500">Your inventory</div>
        <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">
          <span style="font-size:13px">⚪ Balls: <strong>${state.balls}</strong></span>
          <span style="font-size:13px">🔵 Super: <strong>${state.items.superBall}</strong></span>
          <span style="font-size:13px">💊 Heals: <strong>${state.items.healPotion}</strong></span>
          <span style="font-size:13px">⭐ Revives: <strong>${state.items.revive}</strong></span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${[
          {name:"Capture Ball x5",desc:"Throw to catch wild animals",price:30,emoji:"⚪",action:"buyItem('balls',5,30)"},
          {name:"Super Ball x3",desc:"Higher catch rate (+20%)",price:60,emoji:"🔵",action:"buyItem('super',3,60)"},
          {name:"Heal Potion x3",desc:"Restore 40% HP in or out of battle",price:40,emoji:"💊",action:"buyItem('heal',3,40)"},
          {name:"Revive x1",desc:"Revive a fainted team animal",price:80,emoji:"⭐",action:"buyItem('revive',1,80)"},
        ].map(item=>`
          <div class="card" style="display:flex;align-items:center;gap:12px">
            <div style="font-size:32px">${item.emoji}</div>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:500;color:var(--color-text-primary)">${item.name}</div>
              <div style="font-size:12px;color:var(--color-text-secondary)">${item.desc}</div>
            </div>
            <button class="btn-primary" onclick="${item.action}" style="white-space:nowrap;padding:8px 12px">${item.price} 💰</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function buyItem(type,qty,cost){
  if(state.coins<cost){showToast("Not enough coins!");return;}
  state.coins-=cost;
  if(type==="balls")state.balls+=qty;
  else if(type==="super")state.items.superBall+=qty;
  else if(type==="heal")state.items.healPotion+=qty;
  else if(type==="revive")state.items.revive+=qty;
  showToast("Purchased!");save();renderShop();renderExplore();
}

// ─── PROFILE ────────────────────────────────────────────────────────────────
function renderProfile(){
  const caught=Object.keys(state.caught).length;
  document.getElementById("profile-content").innerHTML=`
    <div style="padding:12px">
      <div style="text-align:center;padding:16px 0 20px">
        <div style="width:70px;height:70px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 10px">🌿</div>
        <div style="font-size:18px;font-weight:500;color:var(--color-text-primary)">Wildlife Trainer</div>
        <div style="font-size:13px;color:var(--color-text-secondary);margin-top:2px">Level ${state.level}</div>
      </div>
      <div class="grid-2" style="margin-bottom:14px">
        ${[["Animals caught",caught],["Battles won",state.wins],["Total battles",state.battles],["Coins",state.coins]].map(([label,val])=>`
          <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px;text-align:center">
            <div style="font-size:22px;font-weight:500;color:var(--color-text-primary)">${val}</div>
            <div style="font-size:12px;color:var(--color-text-secondary)">${label}</div>
          </div>`).join("")}
      </div>
      <div class="card" style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)">Animaldex Progress</div>
        <div class="hp-bar" style="height:10px"><div class="hp-fill" style="width:${Math.round(caught/ANIMALS.length*100)}%;background:#1D9E75"></div></div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">${caught} / ${ANIMALS.length} (${Math.round(caught/ANIMALS.length*100)}%)</div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)">Trainer XP</div>
        <div class="xp-bar"><div class="xp-fill" style="width:${Math.min(100,Math.round(state.xp/(state.level*100)*100))}%"></div></div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">${state.xp} / ${state.level*100} XP</div>
      </div>
      <button class="btn-danger" style="width:100%" onclick="resetGame()">Reset Game</button>
    </div>
  `;
}

function resetGame(){
  if(!confirm("Reset all progress?"))return;
  state={balls:15,coins:200,xp:5,level:1,caught:{},team:[],items:{superBall:3,healPotion:3,revive:1},battles:0,wins:0,catches:0};
  save();showToast("Game reset!");showTab("explore");
}

renderExplore();
updateDexCount();
</script>
